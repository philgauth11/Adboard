{% extends "base.html" %}
{% block title %}Créer mon compte{% endblock %}
{% block content %}
<div class="lj-authcard">
  <div style="display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:24px">
    {% include "partials/luijo_tile_dark.html" %}
    <h1 style="font:700 20px var(--font-display);color:var(--fg-1);margin-top:14px">Bienvenue, {{ member.name }} !</h1>
    <p style="color:var(--fg-3);font-size:13px;margin-top:6px">Choisissez votre mot de passe pour activer votre compte.</p>
  </div>
  <form method="POST">
    <div class="lj-field">
      <label class="lj-field__lbl">Mot de passe</label>
      <input class="lj-input" type="password" name="password" required minlength="8">
      <span class="lj-field__hint">Au moins 8 caractères.</span>
    </div>
    <button type="submit" class="lj-btn lj-btn--accent" style="width:100%;justify-content:center;margin-top:6px">Activer mon compte</button>
  </form>
</div>
{% endblock %}
