{% extends "base.html" %}
{% block title %}Mot de passe{% endblock %}
{% block crumbs %}<span>AdBoard</span>{% include "partials/icons/chevron.html" %}<strong>Mot de passe</strong>{% endblock %}
{% block content %}
<div style="max-width:460px">
  <h2 style="font:700 20px var(--font-display);color:var(--fg-1);margin-bottom:18px">Changer mon mot de passe</h2>
  {% if error %}<div class="lj-flash">{{ error }}</div>{% endif %}
  <div class="lj-card" style="padding:24px">
    <form method="POST">
      <div class="lj-field">
        <label class="lj-field__lbl">Mot de passe actuel</label>
        <input class="lj-input" type="password" name="current_password" required autofocus>
      </div>
      <div class="lj-field">
        <label class="lj-field__lbl">Nouveau mot de passe</label>
        <input class="lj-input" type="password" name="new_password" required minlength="8">
        <span class="lj-field__hint">Au moins 8 caractères.</span>
      </div>
      <div class="lj-field">
        <label class="lj-field__lbl">Confirmer le nouveau mot de passe</label>
        <input class="lj-input" type="password" name="confirm_password" required>
      </div>
      <div style="display:flex;gap:10px;margin-top:8px">
        <button class="lj-btn lj-btn--accent" type="submit">Enregistrer</button>
        <a href="{{ url_for('admin.dashboard') }}" class="lj-btn lj-btn--ghost">Annuler</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
