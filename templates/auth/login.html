{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="lj-authcard">
  <div style="display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:28px">
    {% include "partials/luijo_tile_dark.html" %}
    <div style="font:800 24px/1 var(--font-display);letter-spacing:-.02em;color:var(--luijo-burgundy);margin-top:12px;display:inline-flex;align-items:baseline">LU<span style="position:relative;display:inline-block">ı<span style="position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:5px;height:5px;background:var(--luijo-orange);border-radius:1px"></span></span>JO</div>
    <div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);margin-top:6px">Connexion équipe · Tête à Papineau</div>
  </div>
  <form method="POST">
    <div class="lj-field">
      <label class="lj-field__lbl">Courriel</label>
      <input class="lj-input" type="email" name="email" required autofocus>
    </div>
    <div class="lj-field">
      <label class="lj-field__lbl">Mot de passe</label>
      <input class="lj-input" type="password" name="password" required>
    </div>
    <button type="submit" class="lj-btn lj-btn--accent" style="width:100%;justify-content:center;margin-top:6px">Se connecter</button>
  </form>
</div>
{% endblock %}
